name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    uses: benvon/reusable-workflows/.github/workflows/go-quality.yml@f70796de0a6527dbed267a64835c3cc81b8144e0
    with:
      quality_command: make ci-local
      upload_codecov: false
  template:
    # Scaffold invariants must not constrain applications created from this repo.
    if: github.repository == 'benvon/ai-code-template-go'
    name: Template adoption and recipes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum
      - run: make template-check
